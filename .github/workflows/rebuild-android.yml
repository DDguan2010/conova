name: Rebuild Android APK
run-name: Rebuild Conova ${{ inputs.version }} Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: '已有 Release 的版本号，例如 0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conova-release
  cancel-in-progress: false

jobs:
  android:
    name: Build and verify standalone Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Validate version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs

      - name: Validate existing release
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Use preinstalled Android SDK tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        timeout-minutes: 10
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Restore original signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          umask 077
          key_path="$RUNNER_TEMP/conova-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          keytool -list -keystore "$key_path" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS"
          echo "CONOVA_KEYSTORE_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Install dependencies and run shared logic tests
        run: |
          npm ci
          npm test

      - name: Sync standalone app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version
          npm run android:sync

      - name: Run Android unit tests and build signed APK
        working-directory: android
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease \
            -PconovaVersion="$RELEASE_VERSION" -PconovaVersionCode="$ANDROID_VERSION_CODE"

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify installed app in Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android
          script: bash ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Verify signing and collect APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Conova-${RELEASE_VERSION}-android.apk"

      - name: Upload verified APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-android
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/conova-release.keystore"

  publish:
    name: Replace APK in existing release
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.android.outputs.tag }}
      RELEASE_VERSION: ${{ needs.android.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone-android
          path: release

      - name: Preserve previous APK and checksum file
        run: gh release download "$RELEASE_TAG" --pattern '*android.apk' --pattern SHA256SUMS.txt --dir previous

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previous-android-release
          path: previous/
          if-no-files-found: error
          retention-days: 30

      - name: Keep existing Windows installer and regenerate checksums
        run: |
          gh release download "$RELEASE_TAG" --pattern '*.exe' --dir release
          cd release
          sha256sum ./*.apk ./*.exe > SHA256SUMS.txt

      - name: Replace Android APK and checksums
        run: gh release upload "$RELEASE_TAG" release/*.apk release/SHA256SUMS.txt --clobber

      - name: Record APK build commit
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > notes.md
          sed -i '/<!-- conova-android-rebuild -->/,$d' notes.md
          printf '\n<!-- conova-android-rebuild -->\nAndroid APK 可独立运行，无需服务地址。已修复第三方 CDN/媒体端口地址被拦截的问题，并优化长音频拖动、Range 分段读取和备用节点切换。\n\nAndroid 修复提交：%s\n' "$RELEASE_COMMIT" >> notes.md
          gh release edit "$RELEASE_TAG" --notes-file notes.md
